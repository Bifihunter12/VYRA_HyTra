[build]
  publish = "."

# Service worker must never be cached — browsers need to check for updates
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/app-version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML pages — no cache so deploys propagate instantly
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons can be long-lived. App code and CSS must revalidate so phones do not get stuck on old builds.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The only npm package is a dev/test dependency (embedded Postgres for SQL tests); skip it on deploy.
[build.environment]
  NPM_FLAGS = "--omit=dev"

# Digital Asset Links: proves the Android app (com.vyra.hytra) belongs to this site,
# so it opens full screen without a browser bar.
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=300"
