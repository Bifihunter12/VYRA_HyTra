name: Android bundle
# Builds the unsigned Play bundle (AAB) for the Android app in android/.
# The bundle is signed with the upload key outside CI; the key never lives in this repo.
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle -p android :app:bundleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vyra-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Publish to the android-build branch
        run: |
          mkdir out && cp android/app/build/outputs/bundle/release/app-release.aab out/vyra-unsigned.aab
          cd out
          git init -q && git checkout -q -b android-build && git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Unsigned bundle from ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" android-build
